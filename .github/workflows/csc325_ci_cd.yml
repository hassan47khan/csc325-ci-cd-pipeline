name: CSC325 CI/CD

# Trigger: every push to main (pull requests also run the checks, but never deploy)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"   # change this if your tutorial specifies a different version

jobs:
  # Stage 1 - Setup: check out the code and install Python
  setup:
    name: Setup
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Show Python version
        run: python --version

  # Stage 2 - Dependencies: install packages
  dependencies:
    name: Dependencies
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip list

  # Stage 3 - Test: run the full suite; any failing test fails the pipeline
  test:
    name: Test
    needs: dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Run Django test suite
        run: python manage.py test -v 2

  # Stage 4 - Deploy: needs Test, so it cannot start unless every test passed.
  # Only runs for pushes to main, never for pull requests.
  deploy:
    name: Deploy
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy (echo)
        run: |
          echo "Deploying commit ${{ github.sha }} to production..."
          echo "Deployed! Live example: https://github.com/${{ github.repository }}"
